name: PlantaScan
options:
  bundleIdPrefix: com.dribeiro
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pt-BR
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  PlantaScan:
    type: application
    platform: iOS
    sources:
      - path: PlantaScan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dribeiro.plantascan
        PRODUCT_NAME: PlantaScan
        INFOPLIST_FILE: PlantaScan/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
